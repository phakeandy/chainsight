apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - image: phakeandy/chainsight-worker:dev
          name: worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: worker-secret
                  key: DATABASE_URL
            - name: IPFS_API_URL
              valueFrom:
                secretKeyRef:
                  name: worker-secret
                  key: IPFS_API_URL
            - name: PG_LISTEN_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: worker-secret
                  key: PG_LISTEN_CHANNEL
