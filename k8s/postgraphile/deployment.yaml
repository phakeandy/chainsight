apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgraphile
  name: postgraphile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgraphile
  template:
    metadata:
      labels:
        app: postgraphile
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgraphile-secret
                  key: DATABASE_URL
          command:
            - sh
            - -ec
            - |
              pg_isready -d "$DATABASE_URL" || {
                echo "FATAL: cannot connect to PostgreSQL via DATABASE_URL";
                echo "Check DB status, credentials, and network reachability.";
                exit 1;
              }
      containers:
        - image: graphile/postgraphile:4
          name: postgraphile
          args:
            - --connection
            - $(DATABASE_URL)
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --schema
            - chainsight,public
            - --dynamic-json
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgraphile-secret
                  key: DATABASE_URL
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
